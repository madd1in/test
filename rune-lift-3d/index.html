<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101419">
  <title>Rune Lift 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-shell" aria-label="Rune Lift 3D">
    <canvas id="scene" aria-label="3D Spielszene"></canvas>

    <section class="hud" aria-live="polite">
      <div class="brand-chip">Rune Lift 3D</div>
      <div class="hud-strip">
        <span id="objective">Sammle 9 Runen</span>
        <strong id="level-value">Ebene I</strong>
        <strong id="shard-count">0/9</strong>
      </div>
      <button id="assist-button" type="button" class="mode-chip" aria-label="Assist-Modus umschalten" aria-pressed="true">Assist</button>
      <button id="audio-button" type="button" class="icon-button" aria-label="Audio umschalten" aria-pressed="false">M</button>
    </section>

    <section id="start-screen" class="screen active" aria-labelledby="title">
      <div class="menu-panel">
        <p class="eyebrow">Floating Puzzle Platformer</p>
        <h1 id="title">Rune Lift 3D</h1>
        <p class="subtitle">Waehle Assist fuer sichere Bruecken, Ziel-Kompass und Double Jump oder Normal fuer die knackigere Route mit weniger Hilfen.</p>
        <div class="mode-toggle" role="group" aria-label="Schwierigkeit">
          <button id="assist-mode-button" type="button" class="mode-option active" aria-pressed="true">Assist</button>
          <button id="normal-mode-button" type="button" class="mode-option" aria-pressed="false">Normal</button>
        </div>
        <button id="start-button" type="button" class="primary-button">Start</button>
      </div>
    </section>

    <section id="finish-screen" class="screen" aria-labelledby="finish-title">
      <div class="menu-panel compact">
        <p class="eyebrow">Portal stabil</p>
        <h2 id="finish-title">Runenpfad geloest</h2>
        <p id="finish-stats" class="subtitle"></p>
        <button id="again-button" type="button" class="primary-button">Nochmal</button>
      </div>
    </section>

    <div id="toast" class="toast" role="status"></div>
    <div id="touch-ring" class="touch-ring" aria-hidden="true"></div>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "./assets/vendor/three.module.js"
      }
    }
  </script>
  <script type="module" src="./js/game.js"></script>
</body>
</html>
