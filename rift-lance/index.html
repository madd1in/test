<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070d" />
  <title>Rift Lance</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css?v=variety2" />
</head>
<body>
  <main class="shell is-menu-open">
    <div class="preload" aria-hidden="true">
      <img src="assets/generated/rift-loop-bg-tile.png" alt="" />
      <img src="assets/generated/rift-asset-sheet-alpha.png" alt="" />
      <img src="assets/generated/rift-props-sheet-alpha.png" alt="" />
      <img src="assets/generated/rift-projectiles-sheet-alpha.png" alt="" />
      <img src="assets/generated/rift-explosions-sheet-alpha.png" alt="" />
      <img src="assets/generated/rift-shards-sheet-alpha.png" alt="" />
      <img src="assets/generated/rift-orbs-sheet-alpha.png" alt="" />
      <img src="assets/generated/rift-ring-sheet-alpha.png" alt="" />
      <img src="assets/generated/rift-ui-chrome-sheet-alpha.png" alt="" />
      <img src="assets/generated/rift-font-atlas.png" alt="" />
    </div>
    <canvas id="game" width="1280" height="720" aria-label="Rift Lance game canvas"></canvas>

    <section class="hud" aria-label="Status">
      <div class="hud__brand">RIFT LANCE</div>
      <div><span>Score</span><strong id="score">0</strong></div>
      <div><span>Hull</span><strong id="hull">120</strong></div>
      <div><span>Heat</span><strong id="heat">0%</strong></div>
      <div><span>Wave</span><strong id="wave">01</strong></div>
      <div><span>Chain</span><strong id="chain">0</strong></div>
      <div><span>Best</span><strong id="best">0</strong></div>
    </section>

    <div id="banner" class="banner" aria-live="polite">RIFT LANCE</div>

    <section id="menu" class="menu" aria-label="Start menu">
      <div class="menu__frame menu__frame--left" aria-hidden="true"></div>
      <div class="menu__frame menu__frame--right" aria-hidden="true"></div>
      <div class="menu__radar" aria-hidden="true"></div>
      <div class="menu__panel">
        <div class="menu__emblem" aria-hidden="true"></div>
        <div class="menu__plaque">
          <h1 class="sr-only">Rift Lance</h1>
          <img class="menu__logo" src="assets/generated/rift-title-logo.png" alt="Rift Lance" />
        </div>
        <div class="menu__divider" aria-hidden="true"></div>
        <div class="menu__status" aria-label="Mission status">
          <span>Surge</span>
          <span>Lance</span>
          <span>Bloom</span>
        </div>
        <button id="startButton" type="button" class="primary">Launch</button>
        <div class="menu__actions">
          <button id="muteButton" type="button" aria-pressed="false">Audio</button>
          <button id="motionButton" type="button" aria-pressed="false">Motion</button>
        </div>
      </div>
    </section>

    <nav class="touch" aria-label="Touch controls">
      <div class="touch__stick">
        <button type="button" data-touch="up" aria-label="Up">UP</button>
        <button type="button" data-touch="left" aria-label="Left">LT</button>
        <button type="button" data-touch="right" aria-label="Right">RT</button>
        <button type="button" data-touch="down" aria-label="Down">DN</button>
      </div>
      <div class="touch__actions">
        <button type="button" data-touch="fire" aria-label="Fire">FIRE</button>
        <button type="button" data-touch="charge" aria-label="Charge">LANCE</button>
        <button type="button" data-touch="drone" aria-label="Drone">DRONE</button>
      </div>
    </nav>
  </main>

  <audio id="bgm" src="assets/audio/steel-punch-parade.mp3" preload="metadata" loop></audio>
  <script src="game.js?v=variety2"></script>
</body>
</html>
