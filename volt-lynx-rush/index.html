<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Volt Lynx Rush</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app" aria-label="Volt Lynx Rush">
      <section class="game-shell">
        <div class="hud" aria-live="polite">
          <div class="hud__group">
            <span class="hud__pill"><b id="hudHoops">0</b> hoops</span>
            <span class="hud__pill"><b id="hudScore">0</b> score</span>
            <span class="hud__pill"><b id="hudTime">0.0</b>s</span>
          </div>
          <div class="boost" aria-label="Boost energy">
            <div id="hudBoost" class="boost__fill"></div>
          </div>
          <div class="hud__group hud__group--right">
            <span class="hud__pill"><b id="hudSpeed">0</b> km/h</span>
            <button id="audioButton" class="icon-button" type="button" aria-label="Audio">M</button>
            <button id="restartButton" class="icon-button" type="button" aria-label="Restart">R</button>
            <button id="pauseButton" class="icon-button" type="button" aria-label="Pause">P</button>
          </div>
        </div>

        <canvas id="game" width="1280" height="720" aria-label="Volt Lynx Rush playfield"></canvas>

        <div id="overlay" class="overlay overlay--visible">
          <div class="overlay__panel">
            <p class="eyebrow">Original speed platformer</p>
            <h1>Volt Lynx Rush</h1>
            <p class="overlay__copy">Sammle Hoops, nutze Springs, halte Speed und jage durch die Loop-Rails.</p>
            <div class="overlay__actions">
              <button id="startButton" class="primary-button" type="button">Start Run</button>
            </div>
          </div>
        </div>

        <div class="touch-pad" aria-label="Touch controls">
          <button class="touch-pad__button" data-action="left" type="button" aria-label="Left">&lt;</button>
          <button class="touch-pad__button" data-action="right" type="button" aria-label="Right">&gt;</button>
          <button class="touch-pad__button" data-action="jump" type="button" aria-label="Jump">^</button>
          <button class="touch-pad__button" data-action="dash" type="button" aria-label="Dash">B</button>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
