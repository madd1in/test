<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Super Tile Hopper</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" width="960" height="540" aria-label="Super Tile Hopper Spielwelt"></canvas>

      <section class="hud" aria-label="Spielstatus">
        <div class="hud__brand">Super Tile Hopper DX</div>
        <div class="hud__stats">
          <span id="hudLevel">Level 1/4</span>
          <span id="hudCoins">Coins 0/0</span>
          <span id="hudShards">Shards 0/0</span>
          <span id="hudRelics">Relics 0/0</span>
          <span id="hudLives">Lives 3</span>
          <span id="hudAir">Air 1</span>
          <span id="hudDash">Dash 1</span>
          <span id="hudPower">Power 0</span>
          <span id="hudTime">Time 000</span>
        </div>
        <div class="hud__buttons">
          <button id="pauseButton" type="button" aria-label="Pause">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 5h4v14H7zM13 5h4v14h-4z" />
            </svg>
          </button>
          <button id="fullscreenButton" type="button" aria-label="Vollbild umschalten">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 4h7v3H7v4H4V4zm13 3h-4V4h7v7h-3V7zM7 13v4h4v3H4v-7h3zm13 0v7h-7v-3h4v-4h3z" />
            </svg>
          </button>
          <button id="restartButton" type="button" aria-label="Neu starten">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5V2L7 7l5 5V8a5 5 0 1 1-4.58 3H4.26A8 8 0 1 0 12 5z" />
            </svg>
          </button>
        </div>
      </section>

      <section id="overlay" class="overlay overlay--visible" aria-live="polite">
        <div class="overlay__panel">
          <p id="overlayKicker" class="overlay__kicker">Neues Jump-and-run</p>
          <h1 id="overlayTitle">Super Tile Hopper</h1>
          <p id="overlayText">Triple-Jump, Dash, Pipe-Warps, Airship-Boss und Touch-Controls warten.</p>
          <button id="primaryButton" type="button">Start</button>
        </div>
      </section>

      <section class="touch-pad" aria-label="Touch-Steuerung">
        <div class="touch-pad__cluster">
          <button class="touch-pad__button" data-action="left" type="button" aria-label="Links">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 5 8 12l7 7V5z" />
            </svg>
          </button>
          <button class="touch-pad__button" data-action="right" type="button" aria-label="Rechts">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 5 7 7-7 7V5z" />
            </svg>
          </button>
        </div>
        <div class="touch-pad__cluster">
          <button class="touch-pad__button touch-pad__button--run" data-action="run" type="button" aria-label="Dash und Sprint">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h8l-3-3 1.4-1.4L17.8 14l-6.4 6.4L10 19l3-3H5v-4zm2-8h10v3H7V4z" />
            </svg>
          </button>
          <button class="touch-pad__button touch-pad__button--jump" data-action="jump" type="button" aria-label="Springen">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4 5 11h5v9h4v-9h5L12 4z" />
            </svg>
          </button>
        </div>
      </section>
    </main>

    <script src="js/game.js" defer></script>
  </body>
</html>
